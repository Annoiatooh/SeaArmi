name: AtlantisWeapons
version: 1.0
main: com.atlantisrp.Main
api-version: "1.21"

commands:
  armi:
    description: Apre la GUI delle armi (solo OP)
    usage: /armi
  log:
    description: Attiva o disattiva i log di spari e morti
    usage: /log <attiva|disattiva>

  smanetta:
    description: Chiede di smanettare un giocatore ammanettato dagli fdo
    usage: /smanetta [nick]
  adminsmanetta:
    description: Toglie le manette a un giocatore (staff)
    usage: /adminsmanetta <nick>
  adminscorda:
    description: Slega un giocatore dalla corda (staff)
    usage: /adminscorda <nick>
  rapina:
    description: Inizia a rapinare un giocatore entro 5 blocchi
    usage: /rapina <nick>
  controllo:
    description: Guarda l'inventario di chi stai rapinando
    usage: /controllo <nick>

permissions:
  atlantisweapons.admin:
    description: Permette /adminsmanetta e /adminscorda
    default: op
  atlantisweapons.fdo:
    description: Marca il giocatore come fdo (totem e smanetta)
    default: false
  atlantisweapons.crime:
    description: Marca il giocatore come crime (totem e smanetta)
    default: false
  atlantisweapons.log:
    description: Permette di usare /log
    default: op